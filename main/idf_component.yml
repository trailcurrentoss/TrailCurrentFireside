## IDF Component Manager Manifest — Fireside firmware for the Waveshare
## ESP32-P4-WIFI6-Touch-LCD-7B (7" 1024x600 IPS + GT911 touch + ES8311
## codec).
##
## Board notes:
##   - Waveshare publishes a first-party BSP component
##     (waveshare/esp32_p4_wifi6_touch_lcd_7b) that bundles display, touch,
##     I2C, I2S, ES8311, ES7210, PA — everything except the battery ADC.
##   - Battery is a passive divider read via GPIO 20 ADC (see
##     main/battery.c). No idf_component.yml entry needed for that —
##     esp_adc is part of ESP-IDF itself.

dependencies:
  # Waveshare BSP — pins the LCD/touch/codec driver versions internally.
  # Constraint matches the FluidCNC Pendant project (also on this board)
  # and picks up any 1.x. NOTE: this component declares `targets: [esp32p4]`
  # in its own manifest, so `idf.py set-target esp32p4` MUST be run before
  # the first build or the dependency solver fails with
  # "no versions of waveshare/esp32_p4_wifi6_touch_lcd_7b match ^1.0.2".
  waveshare/esp32_p4_wifi6_touch_lcd_7b:
    version: "^1.0.2"
    public: true
    rules:
      - if: target == esp32p4

  # LVGL 8.4 — matches the .eez-project's lvglVersion. The Waveshare BSP
  # declares "lvgl/lvgl: >=8,<10" so this narrower pin still resolves.
  lvgl/lvgl:
    version: "~8.4.0"
    public: true

  # WiFi over ESP-Hosted (ESP32-P4 has no native WiFi — bridged to on-board
  # ESP32-C6 slave over 4-bit SDIO). The Waveshare board uses ESP-Hosted's
  # default SDIO pin map (CLK=18 CMD=19 D0=14 D1=15 D2=16 D3=17), no
  # overrides needed in sdkconfig.defaults.esp32p4.
  espressif/esp_hosted:
    rules:
      - if: target in [esp32p4, esp32h2]
    version: "*"
  espressif/esp_wifi_remote:
    rules:
      - if: target in [esp32p4, esp32h2]
    version: "*"

  # mDNS — reserved for Headwaters discovery. Cheap to keep here.
  espressif/mdns:
    version: "*"

  idf: ">=5.3"
